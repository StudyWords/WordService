spring.application.name=Word-Service-V2
server.port=8121
server.servlet.context-path=/api/v1
spring.config.import=optional:file:.env[.properties]

springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui
springdoc.api-docs.path=/v3/api-docs

springdoc.swagger-ui.persistAuthorization=true
spring.datasource.url=${WORD_SERVICE_DB_URL}
spring.datasource.username=${WORD_SERVICE_DB_USERNAME}
spring.datasource.password=${WORD_SERVICE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
app.props.file-path=${WORD_SERVICE_FILE_PATH:http://localhost:8000/files/download}
eureka.client.enabled=false
eureka.client.service-url.defaultZone=${WORD_SERVICE_EUREKA_URL}
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=${WORD_SERVICE_EUREKA_IP}
